<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語ラップ アルバム全曲解説ポッドキャスト</title>
<meta name="description" content="日本語ラップの名盤を1曲ずつ深掘り解説するポッドキャスト。第1弾はMall Boyz『Mall Tape』。">
<link rel="alternate" type="application/rss+xml" title="RSS" href="feed.xml">
<style>
  :root {
    --bg: #100a18; --panel: #1b1226; --text: #f0eae2; --muted: #988fa0;
    --neon: #ee78b2; --gold: #e8be78;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.8;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  header { text-align: center; margin-bottom: 48px; }
  header img.cover {
    width: 240px; height: 240px; border-radius: 16px;
    box-shadow: 0 12px 48px rgba(238, 120, 178, .25); margin-bottom: 24px;
  }
  .kicker { color: var(--neon); letter-spacing: .35em; font-size: 12px; margin-bottom: 12px; }
  h1 { font-size: 26px; letter-spacing: .06em; margin-bottom: 10px; }
  header p.lead { color: var(--muted); font-size: 14px; max-width: 560px; margin: 0 auto; }
  .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .actions a {
    display: inline-block; padding: 10px 22px; border-radius: 999px;
    text-decoration: none; font-size: 13px; letter-spacing: .08em;
    color: var(--bg); background: var(--gold); font-weight: 700;
  }
  .actions a.ghost { background: transparent; color: var(--text); border: 1px solid #4a3b58; }
  h2 { font-size: 15px; letter-spacing: .25em; color: var(--muted); margin: 40px 0 16px; }
  .episode {
    background: var(--panel); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .episode img { width: 72px; height: 72px; border-radius: 8px; flex-shrink: 0; }
  .episode .t { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .episode .d { color: var(--muted); font-size: 13px; }
  .episode .date { color: var(--gold); font-size: 11px; letter-spacing: .1em; margin-bottom: 2px; }
  .episode audio { width: 100%; margin-top: 10px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 32px 0; }
  footer { margin-top: 56px; text-align: center; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="cover" src="cover-v2.jpg" alt="番組カバー">
    <div class="kicker">J-RAP DEEP DIVE</div>
    <h1>日本語ラップ アルバム全曲解説</h1>
    <p class="lead">日本語ラップの名盤を、1曲ずつじっくり深掘りするポッドキャスト。制作背景・リリックのテーマ・音楽的な仕掛けを、1話1曲で解説します。第1弾は Mall Boyz『Mall Tape』。</p>
    <div class="actions">
      <a href="feed.xml">RSSフィード</a>
      <a class="ghost" href="https://github.com/kenmae-arch/podcast_automation_jrap">GitHub</a>
    </div>
  </header>

  <h2>EPISODES</h2>
  <div id="episodes"><div class="empty">エピソードを読み込み中…</div></div>

  <footer>
    <p>歌詞の朗読・引用は行わず、批評・解説を目的とした番組です。楽曲の権利は各権利者に帰属します。</p>
    <p><a href="https://kenmae-arch.github.io/podcast_automation_music/">姉妹番組: アルバム全曲解説(海外編)</a></p>
  </footer>
</div>
<script>
fetch("episodes.json")
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(eps => {
    const box = document.getElementById("episodes");
    if (!eps.length) throw new Error();
    box.innerHTML = "";
    eps.slice().reverse().forEach(ep => {
      const el = document.createElement("div");
      el.className = "episode";
      const img = ep.image ? ep.image : "cover-v2.jpg";
      el.innerHTML =
        '<img src="' + img + '" alt="" loading="lazy">' +
        '<div style="flex:1;min-width:0">' +
        '<div class="date">' + (ep.published || "").slice(0, 10) + "</div>" +
        '<div class="t"></div><div class="d"></div>' +
        '<audio controls preload="none" src="audio/' + ep.audio_file + '"></audio>' +
        "</div>";
      el.querySelector(".t").textContent = ep.title;
      el.querySelector(".d").textContent = ep.description;
      box.appendChild(el);
    });
  })
  .catch(() => {
    document.getElementById("episodes").innerHTML =
      '<div class="empty">最初のエピソードは準備中です。RSSフィードの公開をお待ちください。</div>';
  });
</script>
</body>
</html>
