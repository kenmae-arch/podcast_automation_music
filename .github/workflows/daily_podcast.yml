name: Podcast Generation

on:
  push:
    paths:
      - "scripts/pending.json" # 台本がpushされたら音声化して配信
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (pydub用)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix web

      - name: Generate podcast episode
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_REFERENCE_ID: ${{ vars.FISH_AUDIO_REFERENCE_ID }}
          LLM_PROVIDER: manual
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          PODCAST_NEW_FEED_URL: ${{ vars.PODCAST_NEW_FEED_URL }}
          PODCAST_TITLE: ${{ vars.PODCAST_TITLE }}
          PODCAST_DESCRIPTION: ${{ vars.PODCAST_DESCRIPTION }}
          PODCAST_AUTHOR: ${{ vars.PODCAST_AUTHOR }}
          PODCAST_CATEGORY: ${{ vars.PODCAST_CATEGORY || 'Sports' }}
          PODCAST_EMAIL: ${{ vars.PODCAST_EMAIL }}
        run: python main.py

      - name: Build website
        run: npm run build --prefix web

      - name: Upload new media to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'album-atlas-media' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured; skipping R2 upload."
            exit 0
          fi

          npm install --global wrangler@4
          git ls-files --others --exclude-standard -- 'docs/audio/*.mp3' | while IFS= read -r media_file; do
            object_name="audio/${media_file##*/}"
            wrangler r2 object put "$R2_BUCKET_NAME/$object_name" \
              --file "$media_file" --content-type audio/mpeg --remote
          done

          find docs/art -type f | sort | while IFS= read -r media_file; do
            object_name="${media_file#docs/}"
            case "$media_file" in
              *.jpg|*.jpeg) content_type="image/jpeg" ;;
              *.png) content_type="image/png" ;;
              *.webp) content_type="image/webp" ;;
              *.svg) content_type="image/svg+xml" ;;
              *) content_type="application/octet-stream" ;;
            esac
            wrangler r2 object put "$R2_BUCKET_NAME/$object_name" \
              --file "$media_file" --content-type "$content_type" --remote
          done

          find docs -maxdepth 1 -type f -name 'cover*' | sort | while IFS= read -r media_file; do
            object_name="${media_file#docs/}"
            case "$media_file" in
              *.jpg|*.jpeg) content_type="image/jpeg" ;;
              *.png) content_type="image/png" ;;
              *.webp) content_type="image/webp" ;;
              *) content_type="application/octet-stream" ;;
            esac
            wrangler r2 object put "$R2_BUCKET_NAME/$object_name" \
              --file "$media_file" --content-type "$content_type" --remote
          done

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ scripts/ web/src/data/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "Publish episode $(date -u +%Y-%m-%d)"
            git push
          fi
